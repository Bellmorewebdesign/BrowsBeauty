<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Brows Beauty</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #f5efe6;
        color: #241d1b;
        font-family: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      .card { max-width: 32rem; display: grid; gap: 1rem; justify-items: center; }
      h1 {
        font-family: 'Iowan Old Style', Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.9rem, 6vw, 2.6rem);
        margin: 0;
        letter-spacing: -0.02em;
      }
      p { margin: 0; color: #5d4b45; line-height: 1.6; }
      .sep { width: 44px; height: 1px; background: #c8a19c; }
      a.home {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0.8rem 1.6rem;
        border-radius: 999px;
        background: #2f2422;
        color: #f5efe6;
        text-decoration: none;
        font-size: 0.92rem;
        letter-spacing: 0.05em;
        margin-top: 0.5rem;
      }
      .meta { font-size: 0.85rem; color: #7b6660; }
      .meta a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="sep"></span>
      <h1>Brows Beauty</h1>
      <p lang="es">Esta página no existe. Vuelve al inicio para ver servicios, equipo y contacto.</p>
      <p lang="en">This page does not exist. Head back to the homepage for services, team, and contact.</p>
      <a class="home" id="home" href="/">Inicio / Home</a>
      <p class="meta">
        145 S Main St, Freeport, NY 11520 ·
        <a href="tel:+16033381605">(603) 338-1605</a>
      </p>
    </div>
    <script>
      // GitHub Pages project sites live under /<repo>/ while user and org sites
      // live at /. The requested path alone cannot tell the two apart, so the
      // likely project root is probed for a file the site is known to publish
      // and only used when it actually answers. Otherwise the origin root wins.
      (function () {
        var link = document.getElementById('home')
        var parts = window.location.pathname.split('/').filter(Boolean)
        if (!parts.length) return
        var candidate = '/' + parts[0] + '/'
        var probe = new Image()
        probe.onload = function () {
          link.setAttribute('href', candidate)
        }
        probe.src = candidate + 'images/favicon-32.png'
      })()
    </script>
  </body>
</html>
